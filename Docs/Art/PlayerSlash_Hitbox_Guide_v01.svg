<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <title>玩家三方向刀光与实际碰撞范围对照</title>
  <rect width="1200" height="560" fill="#172332"/>
  <g font-family="Microsoft YaHei, sans-serif" fill="#dceef4">
