<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <title>敌人与 Boss 攻击视觉和碰撞范围对照</title>
  <rect width="1280" height="900" fill="#172332"/>
  <g font-family="Microsoft YaHei, sans-serif" fill="#e7f4f5">
    <text x="24" y="36" font-size="23">敌人与 Boss 攻击范围对照</text>
    <text x="24" y="60" font-size="14" fill="#a7c0c9">实线亮色为伤害动作；虚线框为碰撞边界或冲锋扫过的身体区域。近战及 Boss 比例：100 px / 世界单位。</text>
  </g>
  <g fill="#213344" stroke="#466476" stroke-width="2">
    <rect x="12" y="80" width="398" height="410" rx="12"/>
    <rect x="426" y="80" width="398" height="410" rx="12"/>
    <rect x="840" y="80" width="428" height="410" rx="12"/>
    <rect x="12" y="510" width="608" height="365" rx="12"/>
    <rect x="636" y="510" width="632" height="365" rx="12"/>
  </g>
  <g font-family="Microsoft YaHei, sans-serif" fill="#f2f6f5" font-size="20">
    <text x="28" y="112">守卫 · 近战挥砍</text>
    <text x="442" y="112">机械虫 · 身体冲锋</text>
    <text x="856" y="112">飞行敌人与射手 · 接触 / 弹体</text>
    <text x="28" y="542">Boss · 横扫</text>
    <text x="652" y="542">Boss · 砸地</text>
  </g>
  <g stroke-width="2" stroke-dasharray="8 5" fill-opacity=".18">
    <rect x="100" y="250" width="165" height="120" fill="#ff754f" stroke="#ff9a7b"/>
    <rect x="455" y="260" width="320" height="90" fill="#ffd257" stroke="#ffdd83"/>
    <rect x="930" y="190" width="90" height="90" fill="#74c8ff" stroke="#8ddcff"/>
    <rect x="80" y="565" width="350" height="250" fill="#ff754f" stroke="#ff9a7b"/>
    <rect x="715" y="530" width="470" height="320" fill="#ffcc51" stroke="#ffdc78"/>
  </g>
  <g fill="#879ba6" stroke="#dce6e9" stroke-width="3">
    <circle cx="85" cy="310" r="31"/><circle cx="75" cy="304" r="7" fill="#ffb476"/>
    <rect x="455" y="270" width="80" height="70" rx="26" fill="#877d52"/>
    <rect x="695" y="270" width="80" height="70" rx="26" fill="#877d52" opacity=".45"/>
    <circle cx="975" cy="235" r="27" fill="#809b9c"/>
    <circle cx="80" cy="690" r="36" fill="#787f81"/>
    <circle cx="950" cy="690" r="36" fill="#787f81"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 182 256 Q 336 310 182 364" stroke="#ffddc2" stroke-width="12"/>
    <path d="M 91 804 L 255 576 L 419 804" stroke="#ffead2" stroke-width="22"/>
    <path d="M 726 839 L 950 541 L 1174 839" stroke="#fff3c6" stroke-width="22"/>
  </g>
  <g fill="none" stroke="#ffd257" stroke-width="4" stroke-dasharray="7 6">
    <path d="M 535 305 H 695" marker-end="url(#arrow)"/>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffd257"/></marker></defs>
  <g>
    <circle cx="1064" cy="230" r="20" fill="#2b9feb" stroke="#b2f2ff" stroke-width="3"/>
    <circle cx="1081" cy="348" r="16" fill="none" stroke="#72cfff" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="1081" cy="348" r="10" fill="#279fee"/>
    <circle cx="1142" cy="348" r="20" fill="none" stroke="#ffae54" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M 1142 335 L 1155 348 L 1142 361 L 1129 348 Z" fill="#ff9a32"/>
    <circle cx="1210" cy="348" r="28" fill="none" stroke="#c679ff" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M 1210 330 L 1228 361 L 1192 361 Z" fill="#a969ea"/>
  </g>
  <g font-family="Microsoft YaHei, sans-serif" fill="#bed4db" font-size="14">
    <text x="28" y="414">判定：1.65 × 1.20；身体前 0.15 至 1.80</text>
    <text x="28" y="443">刀光线宽 0.12，整条弧线留在框内</text>
    <text x="442" y="414">位移上限：2.40；伤害来自身体碰撞框</text>
    <text x="442" y="443">身体宽高以运行时 Collider2D.bounds 为准</text>
    <text x="856" y="414">飞行：身体 0.90 × 0.90 接触；射手弹体半径 0.20</text>
    <text x="856" y="443">Boss 弹体核心半径：蓝 0.10 / 橙 0.13 / 紫 0.18</text>
    <text x="28" y="851">判定：前方 3.50 × 高 2.50；有效亮线内收 0.11</text>
    <text x="652" y="868">判定：以落点为中心 4.70 × 3.20；有效亮线内收 0.11</text>
  </g>
</svg>
